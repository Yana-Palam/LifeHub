<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>LifeHub — нова витрата</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.t-light{--bg:#F3F6F4;--fg:#0E1A16;--card:#FFFFFF;--muted:#EDF1EF;--mfg:#56665F;--border:#DFE6E2;--input:#D3DCD8;--primary:#047857;--pfg:#FFFFFF;--sec:#E6F4EE;--secfg:#065F46;--income:#047857;--expense:#BE123C;--transfer:#1D4ED8;--warning:#B45309;--warnsoft:#FEF3C7;--oksoft:#D1FAE5;--exsoft:#FFE4E6;--plan:#94A3A0;--c1:#059669;--c2:#2563EB;--c3:#D97706;--c4:#7C3AED;--c5:#DB2777;--c6:#0891B2;--c7:#94A3B8}
.t-dark{--bg:#0A110F;--fg:#E7F0EC;--card:#121B18;--muted:#18221F;--mfg:#97AAA3;--border:#24322D;--input:#2C3B36;--primary:#34D399;--pfg:#04271C;--sec:#1A2925;--secfg:#A7F3D0;--income:#34D399;--expense:#FB7185;--transfer:#60A5FA;--warning:#FBBF24;--warnsoft:#3A2C0B;--oksoft:#0F3328;--exsoft:#3B1620;--plan:#5E706A;--c1:#34D399;--c2:#60A5FA;--c3:#FBBF24;--c4:#A78BFA;--c5:#F472B6;--c6:#22D3EE;--c7:#64748B}
</style>
</helmet>
<div class="{{theme}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Manrope, system-ui, sans-serif; font-variant-numeric: tabular-nums; color: var(--fg)">
  <dc-import name="Main" dark="{{dark}}" hint-size="390px,844px"></dc-import>
  <a href="Main.dc.html" aria-label="Закрити" style="position: absolute; inset: 0; background: rgba(5,12,10,.55)"></a>
  <section role="dialog" aria-label="Нова операція" style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--card); border-radius: 28px 28px 0 0; padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="width: 40px; height: 4px; border-radius: 999px; background: var(--input); align-self: center"></div>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h2 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 800">Нова операція</h2>
      <a href="Main.dc.html" aria-label="Закрити" style="width: 44px; height: 44px; border-radius: 999px; background: var(--muted); display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
      </a>
    </div>

    <div role="tablist" aria-label="Тип операції" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: var(--muted)">
      <sc-for list="{{types}}" as="t" hint-placeholder-count="3">
        <button type="button" role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="height: 40px; border: 0; border-radius: 10px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; {{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px; align-items: center; padding: 4px 0">
      <label for="amount" style="font-size: 13px; font-weight: 600; color: var(--mfg)">Сума</label>
      <input id="amount" inputmode="decimal" value="1 284,60 ₴" style="width: 100%; box-sizing: border-box; border: 0; background: transparent; text-align: center; font-family: inherit; font-size: 40px; font-weight: 800; color: {{amountColor}}; outline: none; font-variant-numeric: tabular-nums">
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 700; color: var(--mfg)">Категорія</span>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
          <button type="button" aria-pressed="{{c.selected}}" onClick="{{c.pick}}" style="min-height: 64px; border-radius: 14px; font-family: inherit; font-size: 12px; font-weight: 700; color: var(--fg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; {{c.style}}">
            <span style="width: 12px; height: 12px; border-radius: 999px; background: {{c.color}}"></span>
            {{c.label}}
          </button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 700; color: var(--mfg)">Рахунок</span>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <sc-for list="{{accounts}}" as="a" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{a.selected}}" onClick="{{a.pick}}" style="height: 40px; padding: 0 14px; border-radius: 999px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; {{a.style}}">{{a.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: var(--mfg)">Дата
        <input value="Сьогодні, 24.11.2026" style="height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid var(--input); background: var(--card); color: var(--fg); font-family: inherit; font-size: 14px; font-weight: 600">
      </label>
      <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: var(--mfg)">Опис
        <input value="Тижневі продукти" style="height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid var(--input); background: var(--card); color: var(--fg); font-family: inherit; font-size: 14px; font-weight: 600">
      </label>
    </div>

    <a href="Transactions.dc.html" style="height: 52px; border-radius: 14px; background: var(--primary); color: var(--pfg); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800">Зберегти витрату</a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Тема"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { type: 'expense', cat: 'groceries', acc: 'card' };
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const s = this.state;
    const types = [
      { id: 'expense', label: 'Витрата' },
      { id: 'income', label: 'Дохід' },
      { id: 'transfer', label: 'Переказ' }
    ].map((t) => ({
      ...t,
      selected: s.type === t.id ? 'true' : 'false',
      style: s.type === t.id ? 'background: var(--card); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12)' : 'background: transparent; color: var(--mfg)',
      pick: () => this.setState({ type: t.id })
    }));
    const cats = [
      { id: 'groceries', label: 'Продукти', color: 'var(--c1)' },
      { id: 'utilities', label: 'Комунальні', color: 'var(--c2)' },
      { id: 'cafe', label: 'Кафе', color: 'var(--c3)' },
      { id: 'transport', label: 'Транспорт', color: 'var(--c4)' },
      { id: 'health', label: 'Здоровʼя', color: 'var(--c5)' },
      { id: 'fun', label: 'Розваги', color: 'var(--c6)' },
      { id: 'clothes', label: 'Одяг', color: 'var(--c7)' },
      { id: 'more', label: 'Ще…', color: 'var(--input)' }
    ].map((c) => ({
      ...c,
      selected: s.cat === c.id ? 'true' : 'false',
      style: s.cat === c.id ? 'border: 2px solid var(--primary); background: var(--sec)' : 'border: 1px solid var(--border); background: var(--card)',
      pick: () => this.setState({ cat: c.id })
    }));
    const accounts = [
      { id: 'card', label: 'Картка · 31 120 ₴' },
      { id: 'cash', label: 'Готівка · 3 200 ₴' },
      { id: 'save', label: 'Накопичувальний' }
    ].map((a) => ({
      ...a,
      selected: s.acc === a.id ? 'true' : 'false',
      style: s.acc === a.id ? 'border: 0; background: var(--primary); color: var(--pfg)' : 'border: 1px solid var(--border); background: var(--card); color: var(--fg)',
      pick: () => this.setState({ acc: a.id })
    }));
    const amountColor = s.type === 'income' ? 'var(--income)' : s.type === 'transfer' ? 'var(--transfer)' : 'var(--fg)';
    return { dark: dark, theme: dark ? 't-dark' : 't-light', types: types, cats: cats, accounts: accounts, amountColor: amountColor };
  }
}
</script>
</body>
</html>
