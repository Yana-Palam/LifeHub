<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>LifeHub — рецепт</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.t-light{--bg:#F3F6F4;--fg:#0E1A16;--card:#FFFFFF;--muted:#EDF1EF;--mfg:#56665F;--border:#DFE6E2;--input:#D3DCD8;--primary:#047857;--pfg:#FFFFFF;--sec:#E6F4EE;--secfg:#065F46;--shadow:0 1px 2px rgba(14,26,22,.06),0 4px 16px rgba(14,26,22,.06);--c1:#059669;--c5:#DB2777}
.t-dark{--bg:#0A110F;--fg:#E7F0EC;--card:#121B18;--muted:#18221F;--mfg:#97AAA3;--border:#24322D;--input:#2C3B36;--primary:#34D399;--pfg:#04271C;--sec:#1A2925;--secfg:#A7F3D0;--shadow:none;--c1:#34D399;--c5:#F472B6}
</style>
</helmet>
<div class="{{theme}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font-family: Manrope, system-ui, sans-serif; font-variant-numeric: tabular-nums">
  <div style="flex: 1 1 auto; overflow-y: auto; display: flex; flex-direction: column">
    <div role="img" aria-label="Фото страви (місце для фотографії)" style="height: 220px; position: relative; flex: 0 0 auto; background: linear-gradient(135deg, color-mix(in srgb, var(--c5) 55%, #7f1d1d) 0%, color-mix(in srgb, var(--c1) 45%, #3f1d1d) 100%); display: flex; align-items: flex-end; padding: 16px; box-sizing: border-box">
      <span style="font-size: 12px; font-weight: 700; color: rgba(255,255,255,.9); background: rgba(0,0,0,.25); padding: 4px 10px; border-radius: 999px">Фото страви</span>
      <a href="Menu.dc.html" aria-label="Назад до меню" style="position: absolute; top: 16px; left: 16px; width: 44px; height: 44px; border-radius: 999px; background: rgba(255,255,255,.92); color: #0E1A16; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      </a>
    </div>

    <div style="padding: 16px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-size: 26px; line-height: 32px; font-weight: 800">Борщ український</h1>
        <div style="display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; font-weight: 700">
          <span style="padding: 4px 10px; border-radius: 999px; background: var(--sec); color: var(--secfg)">Перші страви</span>
          <span style="padding: 4px 10px; border-radius: 999px; background: var(--muted); color: var(--mfg)">1 год 30 хв</span>
          <span style="padding: 4px 10px; border-radius: 999px; background: var(--muted); color: var(--mfg)">Рецепт на 4 порції</span>
        </div>
      </div>

      <section style="background: var(--card); border-radius: 20px; box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <h2 style="margin: 0; font-size: 16px; font-weight: 800">Інгредієнти</h2>
          <div style="display: flex; align-items: center; gap: 8px">
            <button type="button" aria-label="Менше порцій" onClick="{{minus}}" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--fg); font-family: inherit; font-size: 20px; font-weight: 800; cursor: pointer">−</button>
            <span aria-live="polite" style="min-width: 72px; text-align: center; font-size: 14px; font-weight: 800">{{servingsLabel}}</span>
            <button type="button" aria-label="Більше порцій" onClick="{{plus}}" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--primary); color: var(--pfg); font-family: inherit; font-size: 20px; font-weight: 800; cursor: pointer">+</button>
          </div>
        </div>
        <div style="display: flex; flex-direction: column">
          <sc-for list="{{items}}" as="it" hint-placeholder-count="9">
            <div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 15px">
              <span style="font-weight: 600">{{it.name}}</span>
              <span style="font-weight: 800; white-space: nowrap">{{it.qty}}</span>
            </div>
          </sc-for>
        </div>
      </section>

      <section style="display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; font-size: 16px; font-weight: 800">Приготування</h2>
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
          <div style="display: flex; gap: 12px">
            <span style="width: 28px; height: 28px; border-radius: 999px; flex: 0 0 auto; background: var(--sec); color: var(--secfg); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800">{{s.n}}</span>
            <span style="font-size: 15px; line-height: 22px; font-weight: 500">{{s.text}}</span>
          </div>
        </sc-for>
      </section>
    </div>
  </div>
  <div style="padding: 12px 16px 24px; background: var(--card); border-top: 1px solid var(--border); display: grid; grid-template-columns: 1fr 2fr; gap: 8px">
    <button type="button" style="height: 52px; border-radius: 14px; border: 1px solid var(--border); background: var(--card); color: var(--fg); font-family: inherit; font-size: 15px; font-weight: 800">Редагувати</button>
    <a href="Menu.dc.html" style="height: 52px; border-radius: 14px; background: var(--primary); color: var(--pfg); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800">Додати в меню</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Тема"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { servings: 6 };
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const base = 4;
    const k = this.state.servings / base;
    const fmt = (x) => String(Math.round(x * 100) / 100).replace('.', ',');
    const ing = [
      ['Яловичина на кістці', 500, 'г'], ['Буряк', 300, 'г'], ['Картопля', 400, 'г'],
      ['Капуста білокачанна', 300, 'г'], ['Морква', 1, 'шт'], ['Цибуля', 1, 'шт'],
      ['Томатна паста', 2, 'ст. л.'], ['Часник', 2, 'зубч.'], ['Сіль', null, 'за смаком']
    ];
    const items = ing.map((i) => ({ name: i[0], qty: i[1] === null ? i[2] : fmt(i[1] * k) + ' ' + i[2] }));
    const word = (n) => (n % 10 === 1 && n % 100 !== 11 ? 'порція' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? 'порції' : 'порцій'));
    const steps = [
      { n: 1, text: 'Залийте мʼясо 3 л холодної води, доведіть до кипіння, зніміть піну й варіть 1 годину.' },
      { n: 2, text: 'Натріть буряк і моркву, наріжте цибулю; обсмажте з томатною пастою 10 хвилин.' },
      { n: 3, text: 'Додайте в бульйон картоплю, через 10 хвилин — капусту, ще через 5 — засмажку.' },
      { n: 4, text: 'Посоліть, додайте часник, дайте настоятися 15 хвилин під кришкою.' }
    ];
    return {
      dark: dark, theme: dark ? 't-dark' : 't-light', items: items, steps: steps,
      servingsLabel: this.state.servings + ' ' + word(this.state.servings),
      minus: () => this.setState({ servings: Math.max(1, this.state.servings - 1) }),
      plus: () => this.setState({ servings: Math.min(20, this.state.servings + 1) })
    };
  }
}
</script>
</body>
</html>
