<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>LifeHub — нижня навігація</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.t-light{--bg:#F3F6F4;--fg:#0E1A16;--card:#FFFFFF;--muted:#EDF1EF;--mfg:#56665F;--border:#DFE6E2;--primary:#047857;--pfg:#FFFFFF;--sec:#E6F4EE;--secfg:#065F46}
.t-dark{--bg:#0A110F;--fg:#E7F0EC;--card:#121B18;--muted:#18221F;--mfg:#97AAA3;--border:#24322D;--primary:#34D399;--pfg:#04271C;--sec:#1A2925;--secfg:#A7F3D0}
</style>
</helmet>
<nav aria-label="Основна навігація" class="{{theme}}" style="width: 390px; height: 96px; box-sizing: border-box; padding: 8px 8px 20px; background: var(--card); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); align-items: end; font-family: Manrope, system-ui, sans-serif; color: var(--mfg); position: relative">
  <a href="Main.dc.html" aria-current="{{homeCurrent}}" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 700; color: {{homeColor}}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>
    <span>Головна</span>
  </a>
  <a href="Transactions.dc.html" aria-current="{{finCurrent}}" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 700; color: {{finColor}}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"></rect><path d="M3 10h18"></path><path d="M16 15h.01"></path></svg>
    <span>Фінанси</span>
  </a>
  <div style="height: 56px; display: flex; justify-content: center; align-items: flex-start">
    <a href="AddExpense.dc.html" aria-label="Нова операція" style="width: 56px; height: 56px; margin-top: -22px; border-radius: 999px; background: var(--primary); color: var(--pfg); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(4,120,87,.35); border: 4px solid var(--card)">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
    </a>
  </div>
  <a href="Shopping.dc.html" aria-current="{{shopCurrent}}" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 700; color: {{shopColor}}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle><path d="M2 3h3l2.7 12.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.5L21 8H6"></path></svg>
    <span>Покупки</span>
  </a>
  <a href="Menu.dc.html" aria-current="{{foodCurrent}}" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 700; color: {{foodColor}}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v18"></path><path d="M4 3v6a3 3 0 0 0 6 0V3"></path><path d="M17 21V3c-2.2 1.2-3.5 3.6-3.5 6.5V13H17"></path></svg>
    <span>Їжа</span>
  </a>
  <a href="Budget.dc.html" aria-current="{{moreCurrent}}" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 700; color: {{moreColor}}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg>
    <span>Ще</span>
  </a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","finance","shopping","food","more"],"default":"home"},"dark":{"editor":"boolean","default":false,"section":"Тема"},"$preview":{"width":390,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const dark = this.props.dark ?? false;
    const on = 'var(--primary)';
    const off = 'var(--mfg)';
    const pick = (k) => (active === k ? on : off);
    const cur = (k) => (active === k ? 'page' : 'false');
    return {
      theme: dark ? 't-dark' : 't-light',
      homeColor: pick('home'), finColor: pick('finance'), shopColor: pick('shopping'), foodColor: pick('food'), moreColor: pick('more'),
      homeCurrent: cur('home'), finCurrent: cur('finance'), shopCurrent: cur('shopping'), foodCurrent: cur('food'), moreCurrent: cur('more')
    };
  }
}
</script>
</body>
</html>
