<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>LifeHub — історія транзакцій</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
@keyframes lh-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.lh-stagger>*{animation:lh-rise 500ms cubic-bezier(.22,1,.36,1) both}
.lh-stagger>*:nth-child(2){animation-delay:50ms}.lh-stagger>*:nth-child(3){animation-delay:100ms}.lh-stagger>*:nth-child(4){animation-delay:150ms}.lh-stagger>*:nth-child(5){animation-delay:200ms}.lh-stagger>*:nth-child(6){animation-delay:250ms}.lh-stagger>*:nth-child(n+7){animation-delay:300ms}
button,a{transition:transform 220ms cubic-bezier(.32,.72,0,1),background-color 220ms ease,color 220ms ease,box-shadow 220ms ease}
button:active,a:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (prefers-reduced-transparency:reduce){[style*="backdrop-filter"]{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:var(--card)!important}}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.t-light{--bg:#F3F6F4;--ambient:radial-gradient(70% 45% at 0% 0%,rgba(16,185,129,.20),transparent 70%),radial-gradient(60% 40% at 100% 15%,rgba(14,116,144,.16),transparent 70%),#F3F6F4;--glass:rgba(255,255,255,.62);--glass-border:rgba(255,255,255,.65);--fg:#0E1A16;--card:#FFFFFF;--muted:#EDF1EF;--mfg:#56665F;--border:#DFE6E2;--input:#D3DCD8;--primary:#047857;--pfg:#FFFFFF;--sec:#E6F4EE;--secfg:#065F46;--income:#047857;--expense:#BE123C;--transfer:#1D4ED8;--shadow:0 1px 2px rgba(14,26,22,.06),0 4px 16px rgba(14,26,22,.06);--c1:#059669;--c2:#2563EB;--c3:#D97706;--c4:#7C3AED;--c5:#DB2777;--c6:#0891B2;--c7:#94A3B8}
.t-dark{--bg:#0A110F;--ambient:radial-gradient(70% 45% at 0% 0%,rgba(52,211,153,.14),transparent 70%),radial-gradient(60% 40% at 100% 15%,rgba(34,211,238,.10),transparent 70%),#0A110F;--glass:rgba(24,36,32,.55);--glass-border:rgba(255,255,255,.08);--fg:#E7F0EC;--card:#121B18;--muted:#18221F;--mfg:#97AAA3;--border:#24322D;--input:#2C3B36;--primary:#34D399;--pfg:#04271C;--sec:#1A2925;--secfg:#A7F3D0;--income:#34D399;--expense:#FB7185;--transfer:#60A5FA;--shadow:none;--c1:#34D399;--c2:#60A5FA;--c3:#FBBF24;--c4:#A78BFA;--c5:#F472B6;--c6:#22D3EE;--c7:#64748B}
</style>
</helmet>
<div class="{{theme}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--ambient); color: var(--fg); font-family: Manrope, system-ui, sans-serif; font-variant-numeric: tabular-nums">
  <div class="lh-stagger" style="flex: 1 1 auto; overflow-y: auto; padding: 16px 16px 120px; display: flex; flex-direction: column; gap: 14px">
    <header style="position: sticky; top: 0; z-index: 5; margin: -16px -16px 0; padding: 20px 16px 12px; display: flex; flex-direction: column; gap: 12px; background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); border-bottom: 1px solid var(--glass-border)">
      <h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 800">Фінанси</h1>
      <nav aria-label="Розділи фінансів" style="display: flex; gap: 8px; overflow-x: auto">
        <a href="Transactions.dc.html" aria-current="page" style="height: 36px; padding: 0 14px; border-radius: 999px; background: var(--fg); color: var(--bg); display: flex; align-items: center; font-size: 13px; font-weight: 700; flex: 0 0 auto">Операції</a>
        <a href="Transactions.dc.html" style="height: 36px; padding: 0 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--border); display: flex; align-items: center; font-size: 13px; font-weight: 700; flex: 0 0 auto">Рахунки</a>
        <a href="Budget.dc.html" style="height: 36px; padding: 0 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--border); display: flex; align-items: center; font-size: 13px; font-weight: 700; flex: 0 0 auto">Бюджети</a>
        <a href="Transactions.dc.html" style="height: 36px; padding: 0 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--border); display: flex; align-items: center; font-size: 13px; font-weight: 700; flex: 0 0 auto">Аналітика</a>
      </nav>
    </header>

    <label style="height: 44px; border-radius: 12px; background: var(--card); border: 1px solid var(--input); display: flex; align-items: center; gap: 8px; padding: 0 12px; color: var(--mfg)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input aria-label="Пошук за описом" placeholder="Пошук за описом" style="flex: 1 1 auto; border: 0; background: transparent; outline: none; font-family: inherit; font-size: 15px; font-weight: 500; color: var(--fg)">
    </label>

    <div style="display: flex; gap: 8px; overflow-x: auto">
      <button type="button" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--primary); background: var(--sec); color: var(--secfg); font-family: inherit; font-size: 13px; font-weight: 700; flex: 0 0 auto">Листопад 2026</button>
      <button type="button" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--fg); font-family: inherit; font-size: 13px; font-weight: 700; flex: 0 0 auto">Усі рахунки</button>
      <button type="button" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--fg); font-family: inherit; font-size: 13px; font-weight: 700; flex: 0 0 auto">Категорії</button>
      <button type="button" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--fg); font-family: inherit; font-size: 13px; font-weight: 700; flex: 0 0 auto">Тип</button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="background: var(--card); border-radius: 16px; padding: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; font-weight: 700; color: var(--mfg)">Доходи</span>
        <span style="font-size: 17px; font-weight: 800; color: var(--income)">+62 000,00 ₴</span>
      </div>
      <div style="background: var(--card); border-radius: 16px; padding: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; font-weight: 700; color: var(--mfg)">Витрати</span>
        <span style="font-size: 17px; font-weight: 800; color: var(--expense)">−31 845,20 ₴</span>
      </div>
    </div>

    <sc-for list="{{days}}" as="day" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 4px 4px 0">
          <h2 style="margin: 0; font-size: 13px; font-weight: 800; color: var(--mfg)">{{day.title}}</h2>
          <span style="font-size: 13px; font-weight: 700; color: var(--mfg)">{{day.total}}</span>
        </div>
        <div style="background: var(--card); border-radius: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column">
          <sc-for list="{{day.items}}" as="tx" hint-placeholder-count="2">
            <div style="display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--border)">
              <span style="width: 40px; height: 40px; border-radius: 999px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; background: {{tx.chipBg}}; color: {{tx.chipFg}}">{{tx.initial}}</span>
              <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{tx.title}}</span>
                <span style="font-size: 12px; font-weight: 600; color: var(--mfg)">{{tx.meta}}</span>
              </div>
              <span style="font-size: 15px; font-weight: 800; white-space: nowrap; color: {{tx.color}}">{{tx.amount}}</span>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 10">
    <dc-import name="BottomNav" active="finance" dark="{{dark}}" hint-size="390px,96px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Тема"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const chip = (c) => ({ chipBg: 'color-mix(in srgb, ' + c + ' 16%, transparent)', chipFg: c });
    const exp = (title, meta, amount, c, initial) => ({ title: title, meta: meta, amount: '−' + amount + ' ₴', color: 'var(--expense)', initial: initial, ...chip(c) });
    const days = [
      { title: 'Сьогодні, 24 листопада', total: '−1 379,60 ₴', items: [
        exp('Тижневі продукти', 'Продукти · Картка', '1 284,60', 'var(--c1)', 'П'),
        exp('Кава з собою', 'Кафе · Готівка', '95,00', 'var(--c3)', 'К'),
        { title: 'Зняття готівки', meta: 'Переказ · Картка → Готівка', amount: '2 000,00 ₴', color: 'var(--transfer)', initial: '⇄', ...chip('var(--transfer)') }
      ] },
      { title: 'Вчора, 23 листопада', total: '−2 490,00 ₴', items: [
        exp('Таксі додому', 'Транспорт · Картка', '640,00', 'var(--c4)', 'Т'),
        exp('Аптека', 'Здоровʼя · Картка', '1 850,00', 'var(--c5)', 'З')
      ] },
      { title: 'Пʼятниця, 20 листопада', total: '+55 760,00 ₴', items: [
        { title: 'Зарплата', meta: 'Зарплата · Картка', amount: '+62 000,00 ₴', color: 'var(--income)', initial: '₴', ...chip('var(--income)') },
        exp('Комунальні послуги', 'Комунальні · Картка', '6 240,00', 'var(--c2)', 'К')
      ] }
    ];
    return { dark: dark, theme: dark ? 't-dark' : 't-light', days: days };
  }
}
</script>
</body>
</html>
